<html lang="en" class="h-full bg-[#08090d] text-white overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Echo Show Clock & Weather</title>

    <script>
        // =========================================================================
        //  TEMPLATE CONFIGURATION VARIABLES
        // =========================================================================

        // Location & Weather Settings
        const CONFIG_ZIP_CODE       = "80916";                      // 5-Digit US ZIP code (e.g. "10101")
        const CONFIG_LOCATION_NAME  = "";       // Custom location header. Default: " "
        const CONFIG_TEMP_UNIT      = "F";                          // "F" for Fahrenheit, "C" for Celsius

        // Media & Theme Customization
        // Daytime background image URL. Leave empty "" for dark slate fallback.
        const CONFIG_BG_IMAGE_URL_DAY   = " "; 
        // Nighttime background image URL. Leave empty "" to reuse day image or fallback.
        const CONFIG_BG_IMAGE_URL_NIGHT = " "; 
        
        const CONFIG_AUDIO_URL      = "https://github.com/doncounts/echo/blob/main/amazonEchoShow.mp3";    // MP3 audio keep-alive stream URL. Leave empty "" to disable.

        // Target Canvas / Screen Size (Width & Height in Pixels)
        // Default: 960x480 (Echo Show 5). Set to "" or 0 for dynamic 100% full screen.
        const CONFIG_CANVAS_WIDTH   = 960;                          // Target screen width in px (e.g., 960 for Echo Show 5, 1280 for Echo Show 8, 1920 for Echo Show 15)
        const CONFIG_CANVAS_HEIGHT  = 480;                          // Target screen height in px (e.g., 480 for Echo Show 5, 800 for Echo Show 8, 1080 for Echo Show 15)

        const CONFIG_TIME_FORMAT    = 12;                           // 12 for AM/PM format, 24 for 24-hour military format

        // Refresh Intervals
        const CONFIG_WEATHER_REFRESH_MINS = 15;                     // Weather API update frequency in minutes

        // =========================================================================
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        /* Dynamic viewport height (100dvh) */
        html, body {
            height: 100%;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background-color: #0f172a;
        }

        /* Smooth dynamic background transition */
        #bg-overlay {
            transition: background-image 1s ease-in-out, opacity 1s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        
        /* Weather glass card background */
        .glass-card {
            background: rgba(12, 16, 28, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Pulse subtle indicator */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.4; }
        }
        .animate-pulse-slow {
            animation: subtle-pulse 3s infinite ease-in-out;
        }

        /* Text shadow for legibility on bright backgrounds */
        .text-glow {
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 2px 6px rgba(0, 0, 0, 0.95);
        }
    </style>
</head>
<body class="w-full h-full flex items-center justify-center select-none relative overflow-hidden bg-[#08090d]" id="app-container">

    <!-- Smooth Background Layer -->
    <div id="bg-overlay" class="absolute inset-0 z-0 pointer-events-none"></div>

    <!-- MP3 Audio loop to maintain audio focus and suppress ambient timeout -->
    <audio id="silent-audio-keepalive" autoplay loop playsinline muted style="display: none;"></audio>

    <!-- Canvas Stage Wrapper for Custom Screen Sizes -->
    <div id="stage-container" class="relative z-10 w-full h-full flex flex-col justify-between p-2 sm:p-3 overflow-hidden transition-all duration-300">

        <!-- Header Section -->
        <header class="w-full flex items-center justify-between z-10 text-[11px] sm:text-xs tracking-widest text-slate-300 uppercase font-medium text-glow flex-shrink-0 pt-0.5">
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse-slow"></span>
                <span id="location-name">LOADING LOCATION...</span>
            </div>
            
            <!-- Controls & Fullscreen Helper Toggle -->
            <div class="flex items-center gap-2">
                <button id="refresh-btn" onclick="fetchWeather()" class="p-1.5 rounded-full glass-card hover:bg-white/20 active:scale-95 transition-all text-slate-200 hover:text-white" title="Refresh Weather">
                    <i class="fa-solid fa-arrows-rotate text-xs"></i>
                </button>
                <button id="fullscreen-btn" onclick="toggleKioskFullscreen(event)" class="px-2.5 py-1 rounded-full glass-card hover:bg-white/20 active:scale-95 transition-all flex items-center gap-1.5 text-slate-200">
                    <i class="fa-solid fa-expand text-[10px]" id="fullscreen-icon"></i>
                    <span id="fullscreen-text" class="text-[11px]">Full Screen</span>
                </button>
            </div>
        </header>

        <!-- Main Clock Container: Dynamically Centered Between Header & Footer -->
        <main class="w-full flex-1 flex flex-col items-center justify-center z-10 relative my-auto">
            
            <!-- Responsive Scaled Clock Display -->
            <div class="flex items-center justify-center tracking-tight text-white text-glow">
                <span id="clock-time" class="text-[140px] sm:text-[185px] leading-none font-semibold tracking-tighter">12:00</span>
                
                <!-- Stacked Seconds and AM/PM Column -->
                <div class="flex flex-col justify-between h-[105px] sm:h-[140px] ml-2 sm:ml-3 text-left py-0.5">
                    <span id="clock-seconds" class="text-xl sm:text-2xl font-mono text-slate-300 font-semibold tracking-wider">00</span>
                    <span id="clock-ampm" class="text-3xl sm:text-4xl font-extrabold text-sky-300 tracking-wider">AM</span>
                </div>
            </div>

            <!-- Date Display -->
            <div id="clock-date" class="text-xl sm:text-3xl font-normal tracking-wide text-slate-200 -mt-1 sm:-mt-2 text-glow">
                Loading Date...
            </div>
        </main>

        <!-- Footer Weather Bar Section -->
        <footer class="w-full max-w-6xl mx-auto z-10 flex-shrink-0 pb-0.5">
            <div class="glass-card rounded-xl py-2 px-3.5 sm:py-2.5 sm:px-5 flex items-center justify-between shadow-2xl gap-2">
                
                <!-- Left Grouping: Current Weather & Rain/Snow Start/Stop Indicator -->
                <div class="flex items-center gap-4 sm:gap-6">
                    
                    <!-- Current Condition Grouping -->
                    <div class="flex items-center gap-3 sm:gap-4.5">
                        <div id="weather-icon-container" class="text-3xl sm:text-5xl text-amber-400 flex items-center justify-center w-9 h-9 sm:w-11 sm:h-11">
                            <i class="fa-solid fa-sun animate-pulse-slow"></i>
                        </div>
                        <div>
                            <div class="flex items-baseline gap-1">
                                <span id="weather-temp" class="text-3xl sm:text-5xl font-bold tracking-tight text-white">--</span>
                                <span id="weather-unit-label" class="text-xl sm:text-2xl text-sky-300 font-light">°F</span>
                            </div>
                            <div id="weather-condition" class="text-xs sm:text-base text-slate-300 uppercase font-medium leading-tight">
                                Loading forecast...
                            </div>
                        </div>
                    </div>

                    <!-- Rain/Snow Alert Grouping -->
                    <div id="rain-alert-container" class="hidden flex items-center gap-3">
                        <div class="text-2xl sm:text-4xl text-sky-400 flex items-center justify-center w-8 h-8 sm:w-10 sm:h-10">
                            <i id="rain-alert-icon" class="fa-solid fa-umbrella animate-bounce"></i>
                        </div>
                        <div>
                            <div id="rain-alert-label" class="text-xs sm:text-base text-slate-300 uppercase font-medium leading-tight">
                                RAIN AT
                            </div>
                            <div id="rain-alert-time" class="text-xl sm:text-3xl font-bold text-white tracking-tight leading-tight">
                                --
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Vertical Divider Left of Radar -->
                <div class="h-9 w-[1px] bg-white/20 hidden sm:block"></div>

                <!-- Center Interactive Live Radar Button -->
                <button onclick="openLiveRadar()" class="flex flex-col items-center justify-center px-2.5 py-1 rounded-lg hover:bg-white/10 active:scale-95 transition-all text-slate-200 hover:text-white cursor-pointer" title="Open Live Radar Map">
                    <div class="text-xs sm:text-base uppercase tracking-wider font-bold text-slate-200 leading-tight">LIVE RADAR</div>
                    <div class="text-lg sm:text-2xl mt-0.5">
                        📡
                    </div>
                </button>

                <!-- Vertical Divider Right of Radar -->
                <div class="h-9 w-[1px] bg-white/20 hidden sm:block"></div>

                <!-- Right Grouping: Detailed Metrics (High/Low, Humidity, Wind, Sun Event) -->
                <div class="flex items-center gap-4 sm:gap-6">
                    
                    <!-- High / Low -->
                    <div class="text-center sm:text-left">
                        <div class="text-xs sm:text-base uppercase tracking-wider text-slate-200 font-bold">High / Low</div>
                        <div class="text-xl sm:text-3xl font-bold text-slate-100 flex items-baseline gap-0.5">
                            <span id="weather-high" class="text-rose-400">--</span>°<span class="text-slate-400 font-light">/</span><span id="weather-low" class="text-sky-300">--</span>°
                        </div>
                    </div>

                    <!-- Humidity -->
                    <div class="text-center sm:text-left">
                        <div class="text-xs sm:text-base uppercase tracking-wider text-slate-200 font-bold">Humidity</div>
                        <div id="weather-humidity" class="text-xl sm:text-3xl font-bold text-slate-100">--%</div>
                    </div>

                    <!-- Wind -->
                    <div class="text-center sm:text-left">
                        <div class="text-xs sm:text-base uppercase tracking-wider text-slate-200 font-bold">Wind</div>
                        <div id="weather-wind" class="text-xl sm:text-3xl font-bold text-slate-100">-- <span id="wind-unit-label" class="text-xs sm:text-sm font-normal text-slate-300">mph</span></div>
                    </div>

                    <!-- Sunrise / Sunset Solar Event -->
                    <div id="solar-event-container" class="hidden sm:block text-center sm:text-left">
                        <div id="solar-event-label" class="text-xs sm:text-base uppercase tracking-wider text-slate-200 font-bold flex items-center gap-1">
                            <i id="solar-event-icon" class="fa-solid fa-sun text-amber-400"></i>
                            <span id="solar-event-title">SUNSET</span>
                        </div>
                        <div id="solar-event-time" class="text-xl sm:text-3xl font-bold text-slate-100">--:--</div>
                    </div>

                </div>
            </div>
        </footer>

    </div>

    <script>
        let resolvedLatitude = 40.5369;
        let resolvedLongitude = -74.1884;
        let resolvedTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;

        const wmoCodeMap = {
            0: { desc: "Clear Sky", icon: "fa-sun", color: "text-amber-400" },
            1: { desc: "Mainly Clear", icon: "fa-cloud-sun", color: "text-amber-300" },
            2: { desc: "Partly Cloudy", icon: "fa-cloud-sun", color: "text-slate-200" },
            3: { desc: "Overcast", icon: "fa-cloud", color: "text-slate-300" },
            45: { desc: "Foggy", icon: "fa-smog", color: "text-slate-300" },
            48: { desc: "Rime Fog", icon: "fa-smog", color: "text-slate-300" },
            51: { desc: "Light Drizzle", icon: "fa-cloud-rain", color: "text-sky-300" },
            53: { desc: "Moderate Drizzle", icon: "fa-cloud-rain", color: "text-sky-400" },
            55: { desc: "Dense Drizzle", icon: "fa-cloud-showers-heavy", color: "text-sky-400" },
            56: { desc: "Freezing Drizzle", icon: "fa-snowflake", color: "text-sky-200" },
            57: { desc: "Dense Freezing Drizzle", icon: "fa-snowflake", color: "text-sky-300" },
            61: { desc: "Slight Rain", icon: "fa-cloud-rain", color: "text-sky-300" },
            63: { desc: "Moderate Rain", icon: "fa-cloud-showers-heavy", color: "text-sky-400" },
            65: { desc: "Heavy Rain", icon: "fa-cloud-showers-water", color: "text-blue-400" },
            66: { desc: "Freezing Rain", icon: "fa-snowflake", color: "text-sky-300" },
            67: { desc: "Heavy Freezing Rain", icon: "fa-snowflake", color: "text-sky-400" },
            71: { desc: "Slight Snow", icon: "fa-snowflake", color: "text-sky-200" },
            73: { desc: "Moderate Snow", icon: "fa-snowflake", color: "text-sky-300" },
            75: { desc: "Heavy Snow", icon: "fa-snowflake", color: "text-sky-400" },
            77: { desc: "Snow Grains", icon: "fa-snowflake", color: "text-sky-200" },
            80: { desc: "Slight Rain Showers", icon: "fa-cloud-sun-rain", color: "text-sky-300" },
            81: { desc: "Moderate Rain Showers", icon: "fa-cloud-showers-heavy", color: "text-sky-400" },
            82: { desc: "Violent Rain Showers", icon: "fa-cloud-showers-water", color: "text-blue-400" },
            85: { desc: "Slight Snow Showers", icon: "fa-snowflake", color: "text-sky-200" },
            86: { desc: "Heavy Snow Showers", icon: "fa-snowflake", color: "text-sky-400" },
            95: { desc: "Thunderstorm", icon: "fa-bolt", color: "text-amber-400" },
            96: { desc: "Thunderstorm with Hail", icon: "fa-bolt", color: "text-amber-400" },
            99: { desc: "Heavy Thunderstorm", icon: "fa-bolt", color: "text-amber-500" }
        };

        function applyStageDimensions() {
            const stage = document.getElementById('stage-container');
            const targetWidth = Number(CONFIG_CANVAS_WIDTH);
            const targetHeight = Number(CONFIG_CANVAS_HEIGHT);

            if (targetWidth > 0 && targetHeight > 0) {
                stage.style.width = `${targetWidth}px`;
                stage.style.height = `${targetHeight}px`;
                stage.style.maxWidth = '100vw';
                stage.style.maxHeight = '100dvh';
                stage.style.aspectRatio = `${targetWidth} / ${targetHeight}`;
            } else {
                stage.style.width = '100vw';
                stage.style.height = '100dvh';
                stage.style.maxWidth = 'none';
                stage.style.maxHeight = 'none';
                stage.style.aspectRatio = 'auto';
            }
        }

        function applyTemplateConfig(isNight = false) {
            applyStageDimensions();

            const bgOverlay = document.getElementById('bg-overlay');
            let targetBgUrl = isNight ? (CONFIG_BG_IMAGE_URL_NIGHT || CONFIG_BG_IMAGE_URL_DAY) : CONFIG_BG_IMAGE_URL_DAY;

            if (targetBgUrl && targetBgUrl.trim() !== "") {
                bgOverlay.style.backgroundImage = `url('${targetBgUrl.trim()}')`;
            } else {
                bgOverlay.style.backgroundImage = "none";
            }

            const isCelsius = CONFIG_TEMP_UNIT.toUpperCase() === "C";
            document.getElementById('weather-unit-label').textContent = isCelsius ? "°C" : "°F";
            document.getElementById('wind-unit-label').textContent = isCelsius ? "km/h" : "mph";

            const audioEl = document.getElementById('silent-audio-keepalive');
            if (CONFIG_AUDIO_URL && CONFIG_AUDIO_URL.trim() !== "") {
                audioEl.innerHTML = `<source src="${CONFIG_AUDIO_URL.trim()}" type="audio/mp3">`;
            } else {
                audioEl.removeAttribute('src');
            }
        }

        function updateClock() {
            const now = new Date();

            const formatterOptions = {
                timeZone: resolvedTimeZone,
                hour: 'numeric',
                minute: '2-digit',
                second: '2-digit',
                hour12: (CONFIG_TIME_FORMAT === 12)
            };

            const formatter = new Intl.DateTimeFormat('en-US', formatterOptions);
            const parts = formatter.formatToParts(now);

            let hours = '';
            let minutes = '';
            let seconds = '';
            let ampm = '';

            parts.forEach(part => {
                if (part.type === 'hour') hours = part.value;
                if (part.type === 'minute') minutes = part.value;
                if (part.type === 'second') seconds = part.value;
                if (part.type === 'dayPeriod') ampm = part.value.toUpperCase();
            });

            document.getElementById('clock-time').textContent = `${hours}:${minutes}`;
            document.getElementById('clock-seconds').textContent = seconds;

            if (CONFIG_TIME_FORMAT === 12) {
                document.getElementById('clock-ampm').textContent = ampm;
                document.getElementById('clock-ampm').style.display = 'block';
            } else {
                document.getElementById('clock-ampm').style.display = 'none';
            }

            const dateOptions = { weekday: 'long', month: 'long', day: 'numeric', timeZone: resolvedTimeZone };
            document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', dateOptions);
        }

        async function resolveZipCode() {
            try {
                const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${CONFIG_ZIP_CODE}&count=1&language=en&format=json`);
                const geoData = await geoRes.json();

                if (geoData.results && geoData.results.length > 0) {
                    const result = geoData.results[0];
                    resolvedLatitude = result.latitude;
                    resolvedLongitude = result.longitude;
                    if (result.timezone) resolvedTimeZone = result.timezone;

                    if (CONFIG_LOCATION_NAME && CONFIG_LOCATION_NAME.trim() !== "") {
                        document.getElementById('location-name').textContent = CONFIG_LOCATION_NAME.trim();
                    } else {
                        const city = result.name ? result.name.toUpperCase() : "LOCAL";
                        const state = result.admin1_code ? result.admin1_code.toUpperCase() : (result.admin1 ? result.admin1.toUpperCase() : "");
                        document.getElementById('location-name').textContent = `${city}${state ? ', ' + state : ''} (${CONFIG_ZIP_CODE})`;
                    }
                } else {
                    document.getElementById('location-name').textContent = CONFIG_LOCATION_NAME || `ZIP ${CONFIG_ZIP_CODE}`;
                }
            } catch (err) {
                console.warn("Zip geocoding error:", err);
                document.getElementById('location-name').textContent = CONFIG_LOCATION_NAME || `ZIP ${CONFIG_ZIP_CODE}`;
            }
        }

        async function fetchWeather() {
            try {
                const isCelsius = CONFIG_TEMP_UNIT.toUpperCase() === "C";
                const tempUnitParam = isCelsius ? "celsius" : "fahrenheit";
                const windSpeedParam = isCelsius ? "kmh" : "mph";

                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${resolvedLatitude}&longitude=${resolvedLongitude}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day&hourly=precipitation_probability,rain,showers,snowfall&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&temperature_unit=${tempUnitParam}&wind_speed_unit=${windSpeedParam}&timezone=auto&_cb=${Date.now()}`
                );
                
                if (!response.ok) throw new Error("Weather network response error");

                const data = await response.json();
                const current = data.current;
                const daily = data.daily;
                const hourly = data.hourly;

                // Handle dynamic background swap based on daytime status
                const isNight = current.is_day === 0;
                applyTemplateConfig(isNight);

                document.getElementById('weather-temp').textContent = Math.round(current.temperature_2m);
                document.getElementById('weather-humidity').textContent = `${Math.round(current.relative_humidity_2m)}%`;
                document.getElementById('weather-wind').innerHTML = `${Math.round(current.wind_speed_10m)} <span id="wind-unit-label" class="text-xs sm:text-sm font-normal text-slate-300">${isCelsius ? 'km/h' : 'mph'}</span>`;
                
                if (daily && daily.temperature_2m_max && daily.temperature_2m_min) {
                    document.getElementById('weather-high').textContent = Math.round(daily.temperature_2m_max[0]);
                    document.getElementById('weather-low').textContent = Math.round(daily.temperature_2m_min[0]);
                }

                const weatherInfo = wmoCodeMap[current.weather_code] || { desc: "Cloudy", icon: "fa-cloud", color: "text-slate-300" };
                document.getElementById('weather-condition').textContent = weatherInfo.desc;

                const iconContainer = document.getElementById('weather-icon-container');
                iconContainer.className = `text-3xl sm:text-5xl flex items-center justify-center w-9 h-9 sm:w-11 sm:h-11 ${weatherInfo.color}`;
                iconContainer.innerHTML = `<i class="fa-solid ${weatherInfo.icon}"></i>`;

                checkUpcomingPrecipitation(hourly, current.weather_code);
                updateSolarEvent(daily);

            } catch (error) {
                console.warn('Weather fetch error:', error);
                document.getElementById('weather-condition').textContent = 'Weather Unavailable';
                document.getElementById('rain-alert-container').classList.add('hidden');
            }
        }

        function updateSolarEvent(daily) {
            if (!daily || !daily.sunrise || !daily.sunset) return;

            const now = new Date();
            const todaySunrise = new Date(daily.sunrise[0]);
            const todaySunset = new Date(daily.sunset[0]);
            const tomorrowSunrise = daily.sunrise[1] ? new Date(daily.sunrise[1]) : null;

            let targetEventTime = null;
            let isSunset = false;

            if (now < todaySunrise) {
                targetEventTime = todaySunrise;
                isSunset = false;
            } else if (now >= todaySunrise && now < todaySunset) {
                targetEventTime = todaySunset;
                isSunset = true;
            } else {
                targetEventTime = tomorrowSunrise || todaySunrise;
                isSunset = false;
            }

            if (targetEventTime) {
                let hours = targetEventTime.getHours();
                const minutes = String(targetEventTime.getMinutes()).padStart(2, '0');
                let formattedTime = "";

                if (CONFIG_TIME_FORMAT === 12) {
                    const ampm = hours >= 12 ? 'PM' : 'AM';
                    hours = hours % 12;
                    hours = hours ? hours : 12;
                    formattedTime = `${hours}:${minutes}<span class="text-xs sm:text-sm font-medium ml-1">${ampm}</span>`;
                } else {
                    formattedTime = `${String(hours).padStart(2, '0')}:${minutes}`;
                }

                document.getElementById('solar-event-title').textContent = isSunset ? "SUNSET" : "SUNRISE";
                document.getElementById('solar-event-time').innerHTML = formattedTime;
                
                const iconEl = document.getElementById('solar-event-icon');
                if (isSunset) {
                    iconEl.className = "fa-solid fa-moon text-amber-300";
                } else {
                    iconEl.className = "fa-solid fa-sun text-amber-400";
                }
            }
        }

        function checkUpcomingPrecipitation(hourly, currentCode) {
            const rainContainer = document.getElementById('rain-alert-container');
            const rainLabel = document.getElementById('rain-alert-label');
            const rainTime = document.getElementById('rain-alert-time');
            const rainIcon = document.getElementById('rain-alert-icon');

            if (!hourly || !hourly.time || !hourly.precipitation_probability) {
                rainContainer.classList.add('hidden');
                return;
            }

            const now = new Date();
            let currentHourIndex = hourly.time.findIndex(t => new Date(t) > new Date(now.getTime() - 45 * 60 * 1000));
            if (currentHourIndex === -1) currentHourIndex = 0;

            const currentProb = hourly.precipitation_probability[currentHourIndex] || 0;
            const currentRainVal = (hourly.rain ? hourly.rain[currentHourIndex] : 0) + (hourly.showers ? hourly.showers[currentHourIndex] : 0);
            const currentSnowVal = hourly.snowfall ? hourly.snowfall[currentHourIndex] : 0;

            const isRainingByCode = [51, 53, 55, 61, 63, 65, 80, 81, 82, 95, 96, 99].includes(currentCode);
            const isSnowingByCode = [56, 57, 66, 67, 71, 73, 75, 77, 85, 86].includes(currentCode);
            
            const isCurrentlyActive = isRainingByCode || isSnowingByCode || currentProb >= 30 || currentRainVal > 0.1 || currentSnowVal > 0.1;

            if (isCurrentlyActive) {
                let stopTime = null;
                const isSnow = isSnowingByCode || (currentSnowVal > currentRainVal);

                for (let i = currentHourIndex + 1; i < hourly.time.length && i < currentHourIndex + 24; i++) {
                    const prob = hourly.precipitation_probability[i] || 0;
                    const rainVal = (hourly.rain ? hourly.rain[i] : 0) + (hourly.showers ? hourly.showers[i] : 0);
                    const snowVal = hourly.snowfall ? hourly.snowfall[i] : 0;

                    if (prob < 20 && rainVal < 0.05 && snowVal < 0.05) {
                        stopTime = new Date(hourly.time[i]);
                        break;
                    }
                }

                if (stopTime) {
                    let hours = stopTime.getHours();
                    if (CONFIG_TIME_FORMAT === 12) {
                        const ampm = hours >= 12 ? 'PM' : 'AM';
                        hours = hours % 12;
                        hours = hours ? hours : 12;
                        rainTime.innerHTML = `${hours}<span class="text-xs sm:text-sm font-medium ml-1">${ampm}</span>`;
                    } else {
                        rainTime.textContent = `${String(hours).padStart(2, '0')}:00`;
                    }

                    rainLabel.textContent = isSnow ? 'SNOW STOPS' : 'RAIN STOPS';
                    rainIcon.className = isSnow ? "fa-solid fa-snowflake text-sky-200 animate-pulse" : "fa-solid fa-umbrella text-sky-400 animate-bounce";
                    rainContainer.classList.remove('hidden');
                } else {
                    rainContainer.classList.add('hidden');
                }

            } else {
                let startTime = null;
                let isSnow = false;

                for (let i = currentHourIndex + 1; i < hourly.time.length && i < currentHourIndex + 24; i++) {
                    const prob = hourly.precipitation_probability[i] || 0;
                    const rainVal = (hourly.rain ? hourly.rain[i] : 0) + (hourly.showers ? hourly.showers[i] : 0);
                    const snowVal = hourly.snowfall ? hourly.snowfall[i] : 0;

                    if (prob >= 30 || rainVal > 0.1 || snowVal > 0.1) {
                        startTime = new Date(hourly.time[i]);
                        if (snowVal > rainVal) isSnow = true;
                        break;
                    }
                }

                if (startTime) {
                    let hours = startTime.getHours();
                    if (CONFIG_TIME_FORMAT === 12) {
                        const ampm = hours >= 12 ? 'PM' : 'AM';
                        hours = hours % 12;
                        hours = hours ? hours : 12;
                        rainTime.innerHTML = `${hours}<span class="text-xs sm:text-sm font-medium ml-1">${ampm}</span>`;
                    } else {
                        rainTime.textContent = `${String(hours).padStart(2, '0')}:00`;
                    }

                    rainLabel.textContent = isSnow ? 'SNOW AT' : 'RAIN AT';
                    rainIcon.className = isSnow ? "fa-solid fa-snowflake text-sky-200 animate-pulse" : "fa-solid fa-umbrella text-sky-400 animate-bounce";
                    rainContainer.classList.remove('hidden');
                } else {
                    rainContainer.classList.add('hidden');
                }
            }
        }

        function openLiveRadar() {
            const windyUrl = `https://www.windy.com/?radar,${resolvedLatitude},${resolvedLongitude},9`;
            window.open(windyUrl, '_blank');
        }

        function initSilentAudioKeepAlive() {
            const audioEl = document.getElementById('silent-audio-keepalive');
            if (!audioEl || !CONFIG_AUDIO_URL || CONFIG_AUDIO_URL.trim() === "") return;

            const playPromise = audioEl.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay waiting for user gesture...", error);
                });
            }

            const handleUserInteraction = () => {
                if (audioEl && CONFIG_AUDIO_URL && CONFIG_AUDIO_URL.trim() !== "") {
                    audioEl.muted = false;
                    if (audioEl.paused) {
                        audioEl.play().catch(e => console.log("User interaction audio play error:", e));
                    }
                }
            };

            document.body.addEventListener('click', handleUserInteraction, { once: false });
            document.body.addEventListener('touchstart', handleUserInteraction, { once: false });

            setInterval(() => {
                if (audioEl && audioEl.paused && CONFIG_AUDIO_URL && CONFIG_AUDIO_URL.trim() !== "") {
                    audioEl.play().catch(() => {});
                }
            }, 30000);
        }

        function toggleKioskFullscreen(e) {
            if (e) e.stopPropagation();

            const doc = window.document;
            const docEl = doc.documentElement;

            const requestFullscreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            const exitFullscreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestFullscreen) {
                    requestFullscreen.call(docEl).then(() => {
                        updateFullscreenBtn(true);
                    }).catch(err => {
                        silkBrowserAutoHideScroll();
                    });
                } else {
                    silkBrowserAutoHideScroll();
                }
            } else {
                if (exitFullscreen) {
                    exitFullscreen.call(doc);
                    updateFullscreenBtn(false);
                }
            }
        }

        function updateFullscreenBtn(isFullscreen) {
            const btnText = document.getElementById('fullscreen-text');
            const btnIcon = document.getElementById('fullscreen-icon');
            if (isFullscreen) {
                btnText.textContent = "Exit";
                btnIcon.className = "fa-solid fa-compress text-[10px]";
            } else {
                btnText.textContent = "Full Screen";
                btnIcon.className = "fa-solid fa-expand text-[10px]";
            }
        }

        function silkBrowserAutoHideScroll() {
            window.scrollTo(0, 1);
            setTimeout(() => {
                window.scrollTo(0, 0);
            }, 100);
        }

        window.addEventListener('resize', applyStageDimensions);

        window.onload = async function() {
            applyTemplateConfig();
            updateClock();
            setInterval(updateClock, 1000);

            await resolveZipCode();
            updateClock(); // Immediately refresh clock with newly resolved timezone
            fetchWeather();
            
            const refreshMs = (CONFIG_WEATHER_REFRESH_MINS || 15) * 60 * 1000;
            setInterval(fetchWeather, refreshMs);

            initSilentAudioKeepAlive();

            document.body.addEventListener('click', (e) => {
                if (e.target.tagName !== 'BUTTON' && !e.target.closest('button')) {
                    silkBrowserAutoHideScroll();
                }
            });

            document.addEventListener("fullscreenchange", () => updateFullscreenBtn(!!document.fullscreenElement));
            document.addEventListener("webkitfullscreenchange", () => updateFullscreenBtn(!!document.webkitFullscreenElement));
        };
    </script>
</body>
